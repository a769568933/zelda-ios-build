name: Manual fallback - iPhone modules
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touch-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile unsigned device module only
        run: bash tools/build_local.sh
      - name: Upload unsigned module and compiler metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iphone-touch-controls
          path: |
            build/local.*/DmPhoneControls.dylib
            build/local.*/build-info.json
            build/local.*/DmExternalDisplay.dylib
            build/local.*/external-display-build.json
          if-no-files-found: error
          retention-days: 7

