name: Build iPhone touch controls
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'tools/build_cloud.sh'
      - 'tools/test_simulator.py'
      - '.github/workflows/build-touch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touch-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile unsigned device module only
        run: bash tools/build_cloud.sh
      - name: Upload unsigned module and compiler metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iphone-touch-controls
          path: |
            build/DmPhoneControls.dylib
            build/build-info.json
          if-no-files-found: error
          retention-days: 7
